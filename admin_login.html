<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Vaijapur</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #082b4c;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 12px;
        }

        .login-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #123c69;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b2948;
        }

        .message {
            text-align: center;
            color: #c0392b;
            margin-top: 12px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>SMART VAIJAPUR</h1>
    <p>Public Grievance and Service App</p>
</header>

<nav>
    <a href="/">Home</a>
    <a href="/login">Citizen Login</a>
    <a href="/admin/login">Admin Login</a>
</nav>

<div class="login-container">

    <h2>Admin Login</h2>
    <p style="text-align:center;">
        Login to access Admin Dashboard
    </p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}">

        <label>Admin Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter admin email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">Login</button>

    </form>

</div>

<footer>
    <p>© 2026 Smart Vaijapur</p>
    <p>Vaijapur Nagar Parishad</p>
</footer>

</body>
</html>
